<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #f6f0ea; }
    body { font-family: "DM Sans", Arial, sans-serif; color: #151110; }
    .canvas { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: linear-gradient(90deg, rgba(65,82,102,.055) 1px, transparent 1px), linear-gradient(180deg, rgba(65,82,102,.045) 1px, transparent 1px), #f6f0ea; background-size: 28px 28px; padding: 64px; }
    .brand { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; letter-spacing: .16em; }
    .grid { position: absolute; left: 64px; right: 64px; top: 150px; display: grid; grid-template-columns: 1.08fr .92fr; gap: 24px; }
    .photo { position: relative; overflow: hidden; background: #f2e6e1; box-shadow: 0 1px 0 rgba(21,17,16,.08); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.08); }
    .large { height: 650px; }
    .stack { display: grid; gap: 24px; }
    .small { height: 313px; }
    .rail { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: repeating-linear-gradient(90deg, rgba(21,17,16,.34) 0 2px, transparent 2px 24px), linear-gradient(90deg, #a7895f, #d8be8d 48%, #a7895f); }
    .copy { position: absolute; left: 64px; right: 64px; bottom: 58px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 36px; }
    .eyebrow { color: #b9746a; font-size: 21px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 78px; line-height: .96; letter-spacing: 0; max-width: 575px; }
    .meta { text-align: right; color: #415266; font-size: 20px; line-height: 1.55; letter-spacing: .08em; text-transform: uppercase; padding-bottom: 10px; }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Velura product social post">
    <p class="brand">VELURA</p>
    <section class="grid">
      <div class="photo large"><img src="../../public/images/products/morningdew-1.jpg" alt="" /><div class="rail"></div></div>
      <div class="stack">
        <div class="photo small"><img src="../../public/images/products/floralluxe-1.jpg" alt="" /></div>
        <div class="photo small"><img src="../../public/images/products/velvetplunge-1.jpg" alt="" /></div>
      </div>
    </section>
    <section class="copy">
      <div>
        <p class="eyebrow">New collection</p>
        <h1>Soft shape, clean lines.</h1>
      </div>
      <p class="meta">MorningDew<br />Floral Luxe<br />Velvet Plunge</p>
    </section>
  </main>
</body>
</html>
