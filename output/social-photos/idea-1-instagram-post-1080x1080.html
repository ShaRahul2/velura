<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #151110; }
    body { font-family: "DM Sans", Arial, sans-serif; color: #f2e6e1; }
    .canvas { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #151110; }
    .hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 16%; opacity: .88; }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(21,17,16,.90), rgba(21,17,16,.45) 48%, rgba(21,17,16,.16)), linear-gradient(180deg, rgba(21,17,16,.08), rgba(21,17,16,.88)); }
    .rail { position: absolute; left: 0; right: 0; bottom: 0; height: 42px; background: repeating-linear-gradient(90deg, rgba(21,17,16,.38) 0 2px, transparent 2px 28px), linear-gradient(90deg, #a7895f, #d8be8d 48%, #a7895f); }
    .vrail { position: absolute; left: 64px; top: 118px; bottom: 42px; width: 36px; background: repeating-linear-gradient(180deg, rgba(21,17,16,.38) 0 2px, transparent 2px 28px), linear-gradient(180deg, #a7895f, #d8be8d 48%, #a7895f); }
    .copy { position: absolute; left: 140px; bottom: 155px; width: 705px; }
    .eyebrow { color: #d8be8d; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 30px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 126px; line-height: .92; letter-spacing: 0; max-width: 690px; }
    .line { width: 160px; height: 2px; margin: 36px 0 26px; background: #b9746a; }
    .sub { width: 520px; color: rgba(242,230,225,.78); font-size: 27px; line-height: 1.35; }
    .brand { position: absolute; top: 58px; left: 64px; font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; letter-spacing: .16em; }
    .tag { position: absolute; right: 58px; bottom: 86px; color: rgba(242,230,225,.62); font-size: 18px; letter-spacing: .12em; text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Velura new collection social post">
    <img class="hero" src="../../public/images/hero/campaign.jpg" alt="" />
    <div class="veil"></div>
    <div class="vrail"></div>
    <p class="brand">VELURA</p>
    <section class="copy">
      <p class="eyebrow">New collection</p>
      <h1>Measured close.<br />Worn quiet.</h1>
      <div class="line"></div>
      <p class="sub">Fit-first lingerie cut for real measurements, soft edges, and everyday calm.</p>
    </section>
    <p class="tag">26AA-52K / XS-4XL</p>
    <div class="rail"></div>
  </main>
</body>
</html>
