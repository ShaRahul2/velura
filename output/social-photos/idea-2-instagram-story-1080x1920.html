<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f6f0ea; }
    body { font-family: "DM Sans", Arial, sans-serif; color: #151110; }
    .canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(90deg, rgba(65,82,102,.055) 1px, transparent 1px), linear-gradient(180deg, rgba(65,82,102,.045) 1px, transparent 1px), #f6f0ea; background-size: 30px 30px; padding: 78px 70px; }
    .brand { font-family: "Cormorant Garamond", Georgia, serif; font-size: 31px; letter-spacing: .16em; }
    .copy { margin-top: 120px; }
    .eyebrow { color: #b9746a; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 24px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 126px; line-height: .92; letter-spacing: 0; max-width: 760px; }
    .photo { position: absolute; overflow: hidden; background: #f2e6e1; box-shadow: 0 1px 0 rgba(21,17,16,.08); }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.1); }
    .one { left: 70px; top: 620px; width: 560px; height: 780px; }
    .two { right: 70px; top: 1000px; width: 390px; height: 540px; border: 18px solid #f6f0ea; }
    .rail { position: absolute; left: 70px; right: 70px; bottom: 230px; height: 38px; background: repeating-linear-gradient(90deg, rgba(21,17,16,.34) 0 2px, transparent 2px 28px), linear-gradient(90deg, #a7895f, #d8be8d 48%, #a7895f); }
    .meta { position: absolute; left: 70px; bottom: 110px; color: #415266; font-size: 24px; line-height: 1.5; letter-spacing: .08em; text-transform: uppercase; }
    .cta { position: absolute; right: 70px; bottom: 104px; padding: 24px 34px; background: #151110; color: #f2e6e1; font-size: 23px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Velura product Instagram story">
    <p class="brand">VELURA</p>
    <section class="copy">
      <p class="eyebrow">New collection</p>
      <h1>Soft shape,<br />clean lines.</h1>
    </section>
    <div class="photo one"><img src="../../public/images/products/morningdew-1.jpg" alt="" /></div>
    <div class="photo two"><img src="../../public/images/products/floralluxe-1.jpg" alt="" /></div>
    <div class="rail"></div>
    <p class="meta">MorningDew / Floral Luxe<br />28A-42DD to 30B-42DD</p>
    <p class="cta">Shop now</p>
  </main>
</body>
</html>
