<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #252a32; }
    body { font-family: "DM Sans", Arial, sans-serif; color: #f2e6e1; }
    .canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #252a32; padding: 78px 70px; }
    .grain { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(242,230,225,.04) 1px, transparent 1px), linear-gradient(180deg, rgba(242,230,225,.035) 1px, transparent 1px); background-size: 30px 30px; }
    .brand { position: relative; z-index: 2; font-family: "Cormorant Garamond", Georgia, serif; font-size: 31px; letter-spacing: .16em; }
    .photo { position: absolute; left: 70px; right: 70px; top: 210px; height: 920px; overflow: hidden; background: #f2e6e1; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; display: block; transform: scale(1.08); }
    .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(37,42,50,.78)); }
    .copy { position: absolute; left: 70px; right: 70px; bottom: 220px; z-index: 2; }
    .eyebrow { color: #d8be8d; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 32px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: 138px; line-height: .92; letter-spacing: 0; max-width: 820px; }
    .sub { width: 690px; margin-top: 38px; color: rgba(242,230,225,.78); font-size: 31px; line-height: 1.35; }
    .rail { position: absolute; left: 70px; right: 70px; bottom: 112px; height: 38px; background: repeating-linear-gradient(90deg, rgba(21,17,16,.38) 0 2px, transparent 2px 28px), linear-gradient(90deg, #a7895f, #d8be8d 48%, #a7895f); }
    .meta { position: absolute; right: 70px; bottom: 58px; color: rgba(242,230,225,.62); font-size: 20px; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="canvas" aria-label="Velura fit Instagram story">
    <div class="grain"></div>
    <p class="brand">VELURA</p>
    <div class="photo"><img src="../../public/images/lookbook/fabric.jpg" alt="" /><div class="shade"></div></div>
    <section class="copy">
      <p class="eyebrow">Find your line</p>
      <h1>Not tight.<br />Not loose.</h1>
      <p class="sub">The new collection is made for the measurements between standard and custom.</p>
    </section>
    <div class="rail"></div>
    <p class="meta">Velura.in</p>
  </main>
</body>
</html>
