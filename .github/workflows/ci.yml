name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velura
          POSTGRES_PASSWORD: velura_dev
          POSTGRES_DB: velura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test/build-time environment. No real secrets — CI never talks to prod.
      DATABASE_URL: postgresql://velura:velura_dev@localhost:5432/velura_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-not-a-real-secret
      ADMIN_EMAIL: admin@velura.local
      ADMIN_PASSWORD: velura-admin-dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local for tooling
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgresql://velura:velura_dev@localhost:5432/velura_test
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          AUTH_URL=http://localhost:3000
          AUTH_SECRET=ci-only-not-a-real-secret
          ADMIN_EMAIL=admin@velura.local
          ADMIN_PASSWORD=velura-admin-dev
          EOF

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to test database
        run: npm run db:push

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
